[workspace]
resolver = "3"
members = [
    "hc32f448",
    "hc32f460",
    "hc32f4a0",
]

[package]
name = "hc32_driver_sys"
version = "0.1.0"
edition = "2024"
description = "Provide driver function binding for HDSC's HC32 series MCU."
keywords = ["HC32", "bindgen", "no_std", "bare-metal"]
categories = ["embedded", "hardware-support", "no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/823984418/hc32_driver_sys"

[dependencies]

[dependencies.anyhow]
version = "1.0.104"

[dependencies.cc]
version = "1.4.4"

[dependencies.regex]
version = "1.13.1"

[dependencies.bindgen]
version = "0.72.1"

[dependencies.lang-c]
git = "https://github.com/823984418/lang-c"
rev = "583757f751060fc452466d442a44999d749b9a53"
